name: Build and publish to GitHub Pages

# Builds the site from /content, checks links, headings, titles, alt text,
# noindex and privacy rules, then publishes the generated _site/ folder to
# the gh-pages branch, which GitHub Pages serves. Mirrors the Doctor-Rainey workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site from Markdown content
        run: node scripts/build.mjs
      - name: Check links, headings, titles and privacy rules
        run: node scripts/check.mjs
      - name: Publish _site to the gh-pages branch
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
